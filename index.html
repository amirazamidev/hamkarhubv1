    <script>
      // Gracefully handle Vite dev HMR WebSocket disconnection errors
      window.addEventListener('error', function(e) {
        if (e && (e.filename?.includes('@vite/client') || e.message?.includes('WebSocket') || e.message?.includes('createWebSocketModuleRunnerTransport'))) {
          e.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
